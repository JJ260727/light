<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>햄스터봇 조도센서 실시간 모니터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border-radius: 20px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; }
    
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: #38bdf8; }
    
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 25px; background-color: #475569; color: #cbd5e1; }
    .status-badge.connected { background-color: #059669; color: #ecfdf5; }

    .sensor-display { background: #0f172a; padding: 25px; border-radius: 16px; margin-bottom: 25px; border: 1px solid #334155; }
    .sensor-title { font-size: 0.9rem; color: #94a3b8; margin-bottom: 10px; }
    .sensor-value { font-size: 3.5rem; font-weight: 800; color: #fbbf24; transition: all 0.2s ease; }
    
    .progress-bg { background-color: #334155; height: 16px; border-radius: 8px; overflow: hidden; margin-top: 15px; }
    .progress-bar { background: linear-gradient(90deg, #f59e0b, #fef08a); height: 100%; width: 0%; transition: width 0.15s ease-out; }

    .btn { background-color: #2563eb; color: white; border: none; padding: 14px 28px; font-size: 1rem; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn:hover { background-color: #1d4ed8; }
    .btn:disabled { background-color: #475569; cursor: not-allowed; }

    .info-text { margin-top: 15px; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>

<div class="card">
  <h1>🐹 햄스터봇 조도센서 모니터</h1>
  <div id="status" class="status-badge">연결 안 됨</div>

  <div class="sensor-display">
    <div class="sensor-title">현재 빛의 세기 (조도)</div>
    <div id="light-value" class="sensor-value">0</div>
    <div class="progress-bg">
      <div id="light-bar" class="progress-bar"></div>
    </div>
  </div>

  <button id="connect-btn" class="btn">햄스터봇 블루투스 연결</button>
  <p class="info-text">* Chrome / Edge 브라우저에서 실행하세요.</p>
</div>

<script>
  let bluetoothDevice;
  let gattCharacteristic;

  const connectBtn = document.getElementById('connect-btn');
  const statusBadge = document.getElementById('status');
  const lightValueDisplay = document.getElementById('light-value');
  const lightBar = document.getElementById('light-bar');

  connectBtn.addEventListener('click', async () => {
    try {
      statusBadge.textContent = '기기 검색 중...';
      
      // 1. Web Bluetooth 기기 검색 (햄스터봇 검색)
      bluetoothDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [
          '6e400001-b5a3-f393-e0a9-e50e24dcca9e', // Nordic UART Service (햄스터 일반 통신)
          '0000180f-0000-1000-8000-00805f9b34fb'
        ]
      });

      statusBadge.textContent = '연결 중...';
      bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

      // 2. GATT 서버 연결
      const server = await bluetoothDevice.gatt.connect();
      
      // 3. 서비스 및 특성(Characteristic) 가져오기
      const services = await server.getPrimaryServices();
      if (services.length === 0) throw new Error("서비스를 찾을 수 없습니다.");

      // 첫 번째 서비스의 특성을 탐색하여 알림(Notification) 구독
      for (const service of services) {
        const characteristics = await service.getCharacteristics();
        for (const char of characteristics) {
          if (char.properties.notify || char.properties.indicate) {
            gattCharacteristic = char;
            await gattCharacteristic.startNotifications();
            gattCharacteristic.addEventListener('characteristicvaluechanged', handleSensorData);
            break;
          }
        }
      }

      statusBadge.textContent = '연결됨';
      statusBadge.classList.add('connected');
      connectBtn.textContent = '연결 해제';
      connectBtn.onclick = disconnect;

    } catch (error) {
      console.error(error);
      statusBadge.textContent = '연결 실패';
      alert('블루투스 연결에 실패했습니다: ' + error.message);
    }
  });

  // 데이터 수신 및 조도센서 파싱 처리
  function handleSensorData(event) {
    const value = event.target.value;
    
    // 햄스터봇 센서 패킷 구조 해석 (모델/버전에 따라 인덱스 조정)
    // 일반적으로 햄스터 패킷의 3번, 4번 바이트에 왼쪽/오른쪽 조도 데이터가 위치합니다.
    if (value.byteLength >= 5) {
      const leftLight = value.getUint8(3);
      const rightLight = value.getUint8(4);
      
      // 양쪽 조도센서의 평균값 계산 (0 ~ 255 범위)
      const avgLight = Math.round((leftLight + rightLight) / 2);

      // UI 업데이트
      lightValueDisplay.textContent = avgLight;
      
      // 0~255 값을 0~100% 비율로 환산하여 바 길이 조절
      const percentage = Math.min(100, Math.max(0, (avgLight / 255) * 100));
      lightBar.style.width = `${percentage}%`;
    }
  }

  function disconnect() {
    if (bluetoothDevice && bluetoothDevice.gatt.connected) {
      bluetoothDevice.gatt.disconnect();
    }
  }

  function onDisconnected() {
    statusBadge.textContent = '연결 해제됨';
    statusBadge.classList.remove('connected');
    connectBtn.textContent = '햄스터봇 블루투스 연결';
    connectBtn.onclick = null;
    lightValueDisplay.textContent = '0';
    lightBar.style.width = '0%';
  }
</script>

</body>
</html>
